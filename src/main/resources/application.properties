spring.application.name=ShadowVibe
spring.datasource.url=jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:60811}}/${DB_NAME:${PGDATABASE:eclipsedb}}
spring.datasource.username=${DB_USER:${PGUSER:myeclipse}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:secreteclipse}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
server.port=${PORT:1010}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

vk.access-token=${VK_ACCESS_TOKEN:}

app.push.vapid.public-key=${VAPID_PUBLIC_KEY:BCXhPp8BJQ8lAhKmN_CiSb15ORlfN42zUgOOxBetD6JtW3bZR6CHs7_nZBKB0Inwtk1a_hxk6sKKfZuJ_mlVkEY}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:mailto:admin@shadowvibe.local}