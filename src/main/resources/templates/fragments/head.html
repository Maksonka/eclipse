<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">ShadowVibe</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}"/>
    <link rel="stylesheet" th:href="@{/css/style.css?v=53}"/>
    <script th:inline="javascript">
        document.documentElement.setAttribute(
            'data-theme-preference',
            /*[[${currentUser != null ? currentUser.themePreference.name().toLowerCase() : 'dark'}]]*/ 'dark'
        );
    </script>
    <script th:src="@{/js/theme.js(v=3)}"></script>
    <script th:src="@{/js/confirm-dialog.js(v=3)}"></script>
    <script th:src="@{/js/attachments.js(v=8)}"></script>
</head>
<body></body>
</html>
