<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="attachment(msg)">
    <span class="attachment" th:if="${msg.attachmentFilename != null and !msg.attachmentFilename.isEmpty()}" th:switch="${msg.attachmentType}">
        <a th:case="'image'"
           class="attachment-image-link"
           href="#"
           th:attr="data-full-src=@{/uploads/messages/{name}(name=${msg.attachmentFilename})}"
           title="Открыть фото">
            <img class="attachment-image"
                 th:src="@{/uploads/messages/{name}(name=${msg.attachmentFilename})}"
                 alt="Фото" loading="lazy"/>
        </a>
        <video th:case="'video'"
               class="attachment-video"
               controls preload="metadata"
               th:src="@{/uploads/messages/{name}(name=${msg.attachmentFilename})}"></video>
        <span th:case="'audio'" class="attachment-audio-wrap">
            <audio class="attachment-audio"
                   controls preload="metadata"
                   th:src="@{/uploads/messages/{name}(name=${msg.attachmentFilename})}"></audio>
            <span class="attachment-file-meta">
                <span class="attachment-file-name" th:text="${msg.attachmentOriginalName}">song.mp3</span>
                <span class="attachment-file-size" th:text="${T(com.example.shadowvibe.Services.AttachmentService).formatSize(msg.attachmentSize)}">размер</span>
            </span>
        </span>
        <a th:case="*"
           class="attachment-file"
           th:href="@{/uploads/messages/{name}(name=${msg.attachmentFilename})}"
           th:attr="download=${msg.attachmentOriginalName}"
           title="Скачать файл">
            <span class="attachment-file-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M14 2v6h6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="attachment-file-name" th:text="${msg.attachmentOriginalName}">file.txt</span>
            <span class="attachment-file-size" th:text="${T(com.example.shadowvibe.Services.AttachmentService).formatSize(msg.attachmentSize)}">размер</span>
        </a>
    </span>
</th:block>
</body>
</html>
