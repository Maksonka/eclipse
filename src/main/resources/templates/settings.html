<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Настройки · TestTitle</title>
</head>
<body class="settings-page">

<div class="settings-shell">
    <a class="settings-back" th:href="@{/chat}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Назад к чатам
    </a>

    <div class="settings-card">
        <div class="settings-header">
            <div class="settings-icon" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="2"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div>
                <h1>Настройки</h1>
                <p class="settings-subtitle">Внешний вид приложения</p>
            </div>
        </div>

        <div class="auth-alert auth-alert-success" th:if="${settingsSaved}">Настройки сохранены</div>
        <div class="auth-alert auth-alert-error" th:if="${settingsError}" th:text="${settingsError}">Ошибка</div>

        <section class="settings-section">
            <h2>Тема оформления</h2>
            <p class="settings-hint">Выберите светлую или тёмную тему интерфейса</p>
            <form class="theme-form" th:action="@{/settings/theme}" method="post" id="theme-form">
                <label class="theme-option">
                    <input type="radio" name="theme" value="DARK"
                           th:checked="${currentUser.themePreference.name() == 'DARK'}"/>
                    <span class="theme-option-card">
                        <span class="theme-preview theme-preview-dark"></span>
                        <span>Тёмная</span>
                    </span>
                </label>
                <label class="theme-option">
                    <input type="radio" name="theme" value="LIGHT"
                           th:checked="${currentUser.themePreference.name() == 'LIGHT'}"/>
                    <span class="theme-option-card">
                        <span class="theme-preview theme-preview-light"></span>
                        <span>Светлая</span>
                    </span>
                </label>
                <button type="submit" class="btn-primary settings-submit">Сохранить тему</button>
            </form>
        </section>


    </div>
</div>

<script>
    document.querySelectorAll('#theme-form input[name="theme"]').forEach(function (input) {
        input.addEventListener('change', function () {
            const theme = input.value === 'LIGHT' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('eclipse-theme', theme);
        });
    });
</script>
</body>
</html>
