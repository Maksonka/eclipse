<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head(~{::title})}">
    <title th:text="'Группа · ' + ${group.name}">Групповой чат</title>
</head>
<body class="chat-page">

<div class="messenger-shell has-active-chat">
    <aside th:replace="~{fragments/chat-sidebar :: sidebar}"></aside>

    <section class="chat-pane">
        <div class="chat-app">
            <header class="chat-header">
                <a class="chat-back mobile-only" th:href="@{/chat}" aria-label="К списку чатов">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a class="chat-peer group-chat-peer" th:href="@{/group/{id}/settings(id=${group.id})}" title="Настройки группы" aria-label="Настройки группы">
                    <div th:replace="~{fragments/avatar :: groupAvatar(${group.avatarFilename}, 'group-chat-icon')}"></div>
                    <div class="chat-peer-info">
                        <h1 class="chat-title" th:text="${group.name}">Группа</h1>
                        <span class="chat-status is-online"
                              th:text="${#lists.size(group.members)} + ' участников'">участники</span>
                    </div>
                </a>
                <button type="button" id="chat-search-button" class="chat-header-btn" aria-label="Поиск в чате" title="Поиск в чате">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                        <path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button type="button" id="group-mute-button"
                        class="chat-header-btn"
                        th:classappend="${groupMuted} ? 'is-muted' : ''"
                        th:attr="data-group-id=${group.id}, data-muted=${groupMuted}"
                        aria-label="Выключить уведомления" title="Выключить уведомления">
                    <svg class="chat-mute-icon chat-mute-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <svg class="chat-mute-icon chat-mute-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button type="button" id="ai-assistant-button" class="chat-header-btn" aria-label="AI-ассистент" title="AI-ассистент">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 3l1.9 5.6 5.9.5-4.5 3.9 1.4 5.8-4.7-3.1-4.7 3.1 1.4-5.8L3.5 9.1l5.9-.5L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </button>
                <a id="e2e-header-btn" class="chat-header-btn e2e-header-btn" th:href="@{/e2e}" aria-label="Сквозное шифрование" title="Сквозное шифрование (E2E)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </a>
            </header>

            <div id="ai-assistant-panel" class="ai-assistant-panel" hidden>
                <div class="ai-assistant-header">
                    <span class="ai-assistant-title">AI-ассистент</span>
                    <span class="ai-assistant-badge">тестовый режим</span>
                    <label class="ai-auto-translate" title="Автоперевод входящих сообщений (тестовый режим)">
                        <input type="checkbox" id="ai-auto-translate"/> Автоперевод входящих
                    </label>
                    <button type="button" id="ai-assistant-close" class="ai-assistant-close" aria-label="Закрыть">&times;</button>
                </div>
                <div id="ai-assistant-messages" class="ai-assistant-messages"></div>
                <div class="ai-assistant-hint">Команды: «найди …», «переведи …», «напиши ответ», «расшифруй голосовые»</div>
                <form id="ai-assistant-form" class="ai-assistant-form">
                    <input type="text" id="ai-assistant-input" placeholder="Спроси ассистента..." autocomplete="off" maxlength="500"/>
                    <button type="submit" aria-label="Отправить">Отправить</button>
                </form>
            </div>

            <div id="pinned-bar" class="pinned-bar" th:if="${pinnedMessages != null and !pinnedMessages.isEmpty()}">
                <span class="pinned-bar-icon" aria-hidden="true">📌</span>
                <div class="pinned-bar-body">
                    <span class="pinned-bar-title">Закреплённые сообщения</span>
                    <div class="pinned-list">
                        <div class="pinned-item" th:each="pm, iter : ${pinnedMessages}" th:classappend="${iter.first} ? 'is-active' : ''" th:attr="data-pinned-id=${pm.id}">
                            <span class="pinned-bar-sender" th:text="${pm.sender.username}"></span>
                            <span class="pinned-bar-preview" th:text="${pinnedPreviews[pm.id]}"></span>
                            <button type="button" class="pinned-item-close" aria-label="Открепить сообщение" title="Открепить"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
                        </div>
                    </div>
                </div>
            </div>

            <main id="messages" class="chat-messages">
                <div class="chat-empty" th:if="${#lists.isEmpty(groupMessages)}">
                    <span class="chat-empty-icon" aria-hidden="true"></span>
                    Напишите первое сообщение в группе
                </div>

                <div class="message-row"
                     th:classappend="${msg.sender.username == #authentication.name ? 'outgoing' : 'incoming'}"
                     th:each="msg : ${groupMessages}"
                     th:if="${!(msg.deletedByUserIds != null and currentUser != null and msg.deletedByUserIds.contains(currentUser.id))}"
                     th:attr="data-message-id=${msg.id}">
                        <div class="message-bubble"
                             th:attr="data-sender=${msg.sender.username}"
                             th:classappend="${msg.stickerUrl != null} ? 'bubble-none' : ''">
                        <span class="sender"
                              th:if="${msg.sender.username != #authentication.name}"
                              th:text="${msg.sender.username}"></span>

                        <div class="reply-block" th:if="${msg.replyToMessageId != null}">
                            <span class="reply-sender" th:text="${msg.replyToSenderUsername}"></span>
                            <span class="reply-text" th:text="${msg.replyToContent}"></span>
                        </div>

                        <div class="forward-badge" th:if="${msg.forwardedFrom != null}"
                             th:text="'Переслано от ' + ${msg.forwardedFrom}"></div>

                        <span class="pin-badge" th:if="${msg.pinnedAt != null}" title="Закреплённое сообщение" aria-label="Закреплённое сообщение">📌</span>

                        <th:block th:if="${msg.attachmentFilename != null}"
                                  th:replace="~{fragments/attachment :: attachment(${msg})}"></th:block>

                        <img class="sticker-image"
                             th:if="${msg.stickerUrl != null}"
                             th:src="${msg.stickerUrl}"
                             th:alt="'Стикер от ' + ${msg.sender.username}"/>

                        <span class="content"
                              th:if="${msg.content != null and !msg.content.isEmpty()}"
                              th:text="${msg.content}"></span>
                        <span class="message-meta">
                            <time class="message-time" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}"></time>
                        </span>
                    </div>
                </div>
            </main>

            <div id="group-typing-indicator" class="typing-row" aria-live="polite">
                <div class="typing-bubble">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
                <span id="group-typing-label" class="typing-label">печатает…</span>
            </div>

            <div id="reply-preview" class="reply-preview">
                <div class="reply-preview-content">
                    <span class="reply-preview-sender"></span>
                    <span class="reply-preview-text"></span>
                </div>
                <button class="reply-preview-close" aria-label="Отмена">&times;</button>
            </div>

            <footer class="chat-composer">
                <div id="attachment-pending" class="attachment-pending" hidden></div>
                <form id="message-form" class="composer-form">
                    <input type="hidden" id="group-id" th:value="${group.id}"/>
                    <button type="button" id="attach-button" class="composer-attach" aria-label="Прикрепить файл" title="Прикрепить файл">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <input type="file" id="attachment-input" multiple="false" hidden aria-hidden="true"/>
                    <input type="text"
                           id="message-input"
                           name="content"
                           placeholder="Сообщение для группы..."
                           autocomplete="off"
                           maxlength="2000"/>
                    <button type="submit" id="send-button" aria-label="Отправить">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Отправить</span>
                    </button>
                </form>
                <div id="composer-error" class="composer-error" hidden></div>
            </footer>
        </div>
    </section>
</div>

<script th:inline="javascript">
    const currentUsername = /*[[${#authentication.name}]]*/ '';
    const currentUserId = /*[[${currentUser.id}]]*/ null;
    const activeGroupId = /*[[${group.id}]]*/ null;
    const initialReactions = /*[[${reactionsByMessage}]]*/ {};
    const mutedDirectPartners = /*[[${mutedDirectPartners}]]*/ [];
    const mutedGroupIds = /*[[${mutedGroupIds}]]*/ [];
</script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<div id="chat-search-modal" class="chat-search-modal" hidden>
    <div class="chat-search-modal-inner">
        <div class="chat-search-modal-header">
            <h3>Поиск в чате</h3>
            <button type="button" id="chat-search-close" class="chat-search-close" aria-label="Закрыть">&times;</button>
        </div>
        <form id="chat-search-form" class="chat-search-form">
            <input type="search" id="chat-search-input" placeholder="Поиск сообщений..." autocomplete="off" maxlength="100"/>
            <button type="submit">Найти</button>
        </form>
        <div id="chat-search-results" class="chat-search-results"></div>
    </div>
</div>
<div id="context-menu" class="context-menu" hidden>
    <button class="context-menu-item" data-action="reply">Ответить</button>
    <button class="context-menu-item" data-action="pin">Закрепить</button>
    <button class="context-menu-item" data-action="favorite">В избранное</button>
    <button class="context-menu-item" data-action="edit">Редактировать</button>
    <button class="context-menu-item" data-action="forward">Переслать</button>
    <button class="context-menu-item" data-action="delete-me">Удалить для себя</button>
    <button class="context-menu-item" data-action="delete-all">Удалить для всех</button>
</div>
<script th:src="@{/js/notifications.js(v=9)}"></script>
 <script th:src="@{/js/stickers.js(v=12)}"></script>
<script th:src="@{/js/reactions.js(v=1)}"></script>
<script th:src="@{/js/forward-dialog.js(v=1)}"></script>
<script th:src="@{/js/mute-manager.js(v=1)}"></script>
    <script th:src="@{/js/chat-group.js(v=17)}"></script>
<script th:src="@{/js/tweetnacl.min.js}"></script>
<script th:src="@{/js/e2e.js(v=2)}"></script>
<script th:src="@{/js/chat-search.js(v=1)}"></script>
<script th:src="@{/js/favorites.js(v=2)}"></script>
<script th:src="@{/js/scheduled-messages.js(v=1)}"></script>
<script th:src="@{/js/premium-ai.js(v=1)}"></script>
<div id="lightbox" class="lightbox">
    <button class="lightbox-close" aria-label="Закрыть">&times;</button>
    <div class="lightbox-content"></div>
</div>
<script>
(function() {
    var lb = document.getElementById('lightbox');
    if (!lb) return;
    var content = lb.querySelector('.lightbox-content');
    var closeBtn = lb.querySelector('.lightbox-close');
    function openLB(html) { content.innerHTML = html; lb.classList.add('is-open'); document.body.style.overflow = 'hidden'; }
    function closeLB() { lb.classList.remove('is-open'); content.innerHTML = ''; document.body.style.overflow = ''; }
    document.addEventListener('click', function(e) {
        var link = e.target.closest('.attachment-image-link');
        if (link) {
            e.preventDefault();
            var src = link.getAttribute('data-full-src') || link.href;
            openLB('<img src="' + src + '" alt="Фото" class="lightbox-img"/>');
            return;
        }
        var vid = e.target.closest('.attachment-video');
        if (vid) { e.preventDefault(); openLB('<video src="' + vid.src + '" controls autoplay class="lightbox-video"/>'); }
    }, true);
    closeBtn.addEventListener('click', closeLB);
    lb.addEventListener('click', function(e) { if (e.target === lb) closeLB(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && lb.classList.contains('is-open')) closeLB(); });
})();
</script>
</body>
</html>
