<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head(~{::title})}">
    <title th:text="'Группа · ' + ${group.name}">Групповой чат</title>
</head>
<body class="chat-page">

<div class="messenger-shell has-active-chat">
    <aside th:replace="~{fragments/chat-sidebar :: sidebar}"></aside>

    <section class="chat-pane">
        <div class="chat-app">
            <header class="chat-header">
                <a class="chat-back mobile-only" th:href="@{/chat}" aria-label="К списку чатов">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <div class="chat-peer group-chat-peer">
                    <div th:replace="~{fragments/avatar :: groupAvatar(${group.avatarFilename}, 'group-chat-icon')}"></div>
                    <div class="chat-peer-info">
                        <h1 class="chat-title" th:text="${group.name}">Группа</h1>
                        <span class="chat-status is-online"
                              th:text="${#lists.size(group.members)} + ' участников'">участники</span>
                    </div>
                </div>
                <a class="chat-options" th:href="@{/group/{id}/settings(id=${group.id})}" title="Информация о группе" aria-label="Информация о группе">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 5V3M12 21v-2M5 12H3M21 12h-2M6.3 6.3L4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
            </header>

            <main id="messages" class="chat-messages">
                <div class="chat-empty" th:if="${#lists.isEmpty(groupMessages)}">
                    <span class="chat-empty-icon" aria-hidden="true"></span>
                    Напишите первое сообщение в группе
                </div>

                <div class="message-row"
                     th:classappend="${msg.sender.username == #authentication.name ? 'outgoing' : 'incoming'}"
                     th:each="msg : ${groupMessages}"
                     th:attr="data-message-id=${msg.id}">
                    <div class="message-bubble">
                        <span class="sender"
                              th:if="${msg.sender.username != #authentication.name}"
                              th:text="${msg.sender.username}"></span>

                        <div class="reply-block" th:if="${msg.replyToMessageId != null}">
                            <span class="reply-sender" th:text="${msg.replyToSenderUsername}"></span>
                            <span class="reply-text" th:text="${msg.replyToContent}"></span>
                        </div>

                        <th:block th:if="${msg.attachmentFilename != null}"
                                  th:replace="~{fragments/attachment :: attachment(${msg})}"></th:block>

                        <span class="content deleted-text"
                              th:if="${msg.deletedByUserIds != null and currentUser != null and msg.deletedByUserIds.contains(currentUser.id)}"
                              th:text="'Сообщение удалено'"></span>
                        <span class="content"
                              th:if="${!(msg.deletedByUserIds != null and currentUser != null and msg.deletedByUserIds.contains(currentUser.id)) and msg.content != null and !msg.content.isEmpty()}"
                              th:text="${msg.content}"></span>
                        <span class="message-meta">
                            <time class="message-time" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}"></time>
                        </span>
                    </div>
                </div>
            </main>

            <footer class="chat-composer">
                <form id="message-form" class="composer-form">
                    <input type="hidden" id="group-id" th:value="${group.id}"/>
                    <button type="button" id="attach-button" class="composer-attach" aria-label="Прикрепить файл" title="Прикрепить файл">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <input type="file" id="attachment-input" multiple="false" hidden aria-hidden="true"/>
                    <input type="text"
                           id="message-input"
                           name="content"
                           placeholder="Сообщение для группы..."
                           required
                           autocomplete="off"
                           maxlength="2000"/>
                    <button type="submit" id="send-button" aria-label="Отправить">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Отправить</span>
                    </button>
                </form>
                <div id="composer-error" class="composer-error" hidden></div>
            </footer>
        </div>
    </section>
</div>

<script th:inline="javascript">
    const currentUsername = /*[[${#authentication.name}]]*/ '';
    const activeGroupId = /*[[${group.id}]]*/ null;
</script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/chat-group.js(v=3)}"></script>
<div id="context-menu" class="context-menu" hidden>
    <button class="context-menu-item" data-action="reply">Ответить</button>
    <button class="context-menu-item" data-action="delete-me">Удалить для себя</button>
    <button class="context-menu-item" data-action="delete-all">Удалить для всех</button>
</div>
<div id="reply-preview" class="reply-preview">
    <div class="reply-preview-content">
        <span class="reply-preview-sender"></span>
        <span class="reply-preview-text"></span>
    </div>
    <button class="reply-preview-close" aria-label="Отмена">&times;</button>
</div>
<div id="lightbox" class="lightbox">
    <button class="lightbox-close" aria-label="Закрыть">&times;</button>
    <div class="lightbox-content"></div>
</div>
<script>
(function() {
    var lb = document.getElementById('lightbox');
    if (!lb) return;
    var content = lb.querySelector('.lightbox-content');
    var closeBtn = lb.querySelector('.lightbox-close');
    function openLB(html) { content.innerHTML = html; lb.classList.add('is-open'); document.body.style.overflow = 'hidden'; }
    function closeLB() { lb.classList.remove('is-open'); content.innerHTML = ''; document.body.style.overflow = ''; }
    document.addEventListener('click', function(e) {
        var link = e.target.closest('.attachment-image-link');
        if (link) {
            e.preventDefault();
            var src = link.getAttribute('data-full-src') || link.href;
            openLB('<img src="' + src + '" alt="Фото" class="lightbox-img"/>');
            return;
        }
        var vid = e.target.closest('.attachment-video');
        if (vid) { e.preventDefault(); openLB('<video src="' + vid.src + '" controls autoplay class="lightbox-video"/>'); }
    }, true);
    closeBtn.addEventListener('click', closeLB);
    lb.addEventListener('click', function(e) { if (e.target === lb) closeLB(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && lb.classList.contains('is-open')) closeLB(); });
})();
</script>
</body>
</html>
