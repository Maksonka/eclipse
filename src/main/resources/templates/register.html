<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Регистрация · ShadowVibe</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}"/>
    <link rel="stylesheet" th:href="@{/css/style.css?v=10}"/>
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="auth-page">

<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo">
                <img th:src="@{/img/favicon.png}" alt="ShadowVibe"/>
            </div>
            <h1>Создать аккаунт</h1>
            <p>Укажите email, ник и пароль</p>
        </div>

        <div class="auth-alert auth-alert-error" th:if="${registerError}" th:text="${registerError}"></div>

        <form class="auth-form" th:action="@{/register}" method="post">
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" placeholder="you@example.com" required autocomplete="email" th:value="${enteredEmail}"/>
            </label>
            <label class="field">
                <span>Никнейм</span>
                <input type="text" name="username" placeholder="username" required autocomplete="username" minlength="3" maxlength="32" th:value="${enteredUsername}"/>
            </label>
            <label class="field">
                <span>Пароль</span>
                <input type="password" name="password" placeholder="••••••••" required autocomplete="new-password" minlength="4"/>
            </label>
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>

        <p class="auth-footer">
            Уже есть аккаунт?
            <a th:href="@{/login}">Войти</a>
        </p>
    </div>
</div>

</body>
</html>
