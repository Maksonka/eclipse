<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${profileUser.username} + ' · Профиль'">Профиль</title>
    <link rel="stylesheet" th:href="@{/css/style.css?v=9}"/>
    <script th:inline="javascript">
        document.documentElement.setAttribute(
            'data-theme-preference',
            /*[[${isOwnProfile ? profileUser.themePreference.name().toLowerCase() : 'dark'}]]*/ 'dark'
        );
    </script>
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="profile-page">

<div class="profile-shell">
    <a class="profile-back" th:href="@{/chat}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Назад к чатам
    </a>

    <div class="profile-card">
        <div class="auth-alert auth-alert-success" th:if="${profileSaved}">Профиль успешно сохранён</div>

        <div class="profile-header">
            <div th:replace="~{fragments/avatar :: avatar(${profileUser.username}, ${profileUser.avatarFilename}, 'profile-avatar')}"></div>
            <div class="profile-header-info">
                <h1 th:text="${profileUser.username}">username</h1>
                <p class="profile-subtitle" th:if="${isOwnProfile}">Ваш профиль</p>
                <p class="profile-subtitle" th:unless="${isOwnProfile}">Пользователь TestTitle</p>
            </div>
        </div>

        <div class="profile-section">
            <h2>О себе</h2>
            <p class="profile-about" th:if="${profileUser.about != null and !#strings.isEmpty(profileUser.about)}"
               th:text="${profileUser.about}">О себе</p>
            <p class="profile-about profile-about-empty" th:unless="${profileUser.about != null and !#strings.isEmpty(profileUser.about)}">
                <span th:if="${isOwnProfile}">Вы ещё не заполнили информацию о себе</span>
                <span th:unless="${isOwnProfile}">Пользователь пока ничего не написал</span>
            </p>
        </div>

        <div class="profile-actions">
            <a th:if="${isOwnProfile}" class="btn-primary profile-action-btn" th:href="@{/profile/edit}">Редактировать профиль</a>
            <a th:unless="${isOwnProfile}" class="btn-primary profile-action-btn" th:href="@{/chat/{username}(username=${profileUser.username})}">Написать сообщение</a>
            <a th:if="${isOwnProfile}" class="btn-secondary profile-action-btn" th:href="@{/chat}">Открыть чаты</a>
        </div>
    </div>
</div>

</body>
</html>
