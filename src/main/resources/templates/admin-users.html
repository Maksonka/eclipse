<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head th:replace="~{fragments/head :: head(~{::title})}">
    <title>Пользователи · TestTitle</title>
</head>
<body class="settings-page">

<div class="settings-shell">
    <a class="settings-back" th:href="@{/chat}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Назад к чатам
    </a>

    <div class="settings-card">
        <div class="settings-header">
            <div class="settings-icon" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <circle cx="9" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M2 20c0-4 3.5-7 7-7s7 3 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M17 11l4 4m0-4l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div>
                <h1>Пользователи</h1>
                <p class="settings-subtitle" th:text="'Всего: ' + ${#lists.size(users)}">Всего: 0</p>
            </div>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Ник</th>
                    <th>Роль</th>
                    <th>Аватар</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user, iter : ${users}"
                    th:classappend="${user.username == currentUser.username ? 'is-me' : ''}">
                    <td th:text="${iter.count}">1</td>
                    <td>
                        <a class="admin-user-link" th:href="@{/profile/{username}(username=${user.username})}"
                           th:text="${user.username}">user</a>
                    </td>
                    <td>
                        <span class="admin-role" th:classappend="${user.role.name() == 'ADMIN'} ? ' is-admin' : ''"
                              th:text="${user.role.name() == 'ADMIN' ? 'Администратор' : 'Пользователь'}">user</span>
                    </td>
                    <td th:text="${user.hasAvatar()} ? 'Да' : '—'">Да</td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="4" class="admin-empty">Пользователи не найдены</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
